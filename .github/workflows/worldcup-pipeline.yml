name: World Cup 2026 - Live Predictions

on:
  schedule:
    - cron: "0 0,6,12,18 * 6 *"
    - cron: "0 0,6,12,18 * 7 *"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  worldcup-predictions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Generate predictions JSON (ELO-based)
        run: |
          python -c "
          import json
          import pandas as pd
          from src.models.elo_predictor import EloPredictor

          with open('data/fixtures_wc2026.json', encoding='utf-8') as f:
              fixtures = json.load(f)
          df = pd.DataFrame(fixtures)
          predictor = EloPredictor('data/team_ratings.json')
          output = predictor.generate(df)
          with open('predictions/latest.json', 'w', encoding='utf-8') as f:
              f.write(output)
          parsed = json.loads(output)
          print(f'World Cup predictions generated: {len(parsed[\"matches\"])} matches')
          print(f'Model: {parsed[\"model\"]}')
          total_preds = sum(1 for m in parsed['matches'] if m.get('model') == 'elo')
          total_tbd = sum(1 for m in parsed['matches'] if m.get('status') == 'TBD')
          print(f'Predictions: {total_preds}, TBD (knockout): {total_tbd}')
          for m in parsed['matches'][:5]:
              if 'probabilities' in m:
                  p = m['probabilities']
                  print(f'  {m[\"home\"]:20s} vs {m[\"away\"]:20s}  '
                        f'1: {p[\"home\"]*100:5.1f}%  X: {p[\"draw\"]*100:5.1f}%  2: {p[\"away\"]*100:5.1f}%')
              else:
                  print(f'  TBD ({m[\"stage\"]}) - {m[\"date\"]}')
          "

      - name: Enrich predictions with news sentiment (Tavily AI)
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          # Calcular date_from según la fecha actual (UTC)
          # Wave 1: antes del 14 Jun → procesar desde 11 Jun
          # Wave 2: antes del 17 Jun → procesar desde 14 Jun
          # Wave 3: antes del 20 Jun → procesar desde 17 Jun
          # Wave 4: antes del 23 Jun → procesar desde 20 Jun
          # Wave 5: antes del 26 Jun → procesar desde 23 Jun
          # Wave 6: 26 Jun en adelante → procesar desde 26 Jun
          CURRENT_DATE=$(date -u +%Y-%m-%d)
          if [[ "$CURRENT_DATE" < "2026-06-14" ]]; then
            DATE_FROM="2026-06-11"
          elif [[ "$CURRENT_DATE" < "2026-06-17" ]]; then
            DATE_FROM="2026-06-14"
          elif [[ "$CURRENT_DATE" < "2026-06-20" ]]; then
            DATE_FROM="2026-06-17"
          elif [[ "$CURRENT_DATE" < "2026-06-23" ]]; then
            DATE_FROM="2026-06-20"
          elif [[ "$CURRENT_DATE" < "2026-06-26" ]]; then
            DATE_FROM="2026-06-23"
          else
            DATE_FROM="2026-06-26"
          fi
          echo "Fecha de inicio: $DATE_FROM"
          python -m scripts.news_sentiment 8 "$DATE_FROM"
          echo "News sentiment enrichment complete"

      - name: Deploy to gh-pages
        run: |
          git config user.name 'github-actions'
          git config user.email 'actions@github.com'
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git checkout --orphan gh-pages 2>/dev/null || git checkout gh-pages
          cp -r predictions/latest.json .
          git add latest.json
          git commit -m 'deploy: worldcup predictions $(date +%Y-%m-%d_%H:%M)'
          git push origin gh-pages --force
