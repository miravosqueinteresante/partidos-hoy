name: World Cup 2026 - Live Predictions

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0,6,12,18 * 6 *"
    - cron: "0 0,6,12,18 * 7 *"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  worldcup-predictions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Download previous predictions and cache
        run: |
          mkdir -p predictions data
          curl -sL -o predictions/latest.json \
            "https://raw.githubusercontent.com/miravosqueinteresante/partidos-hoy/gh-pages/latest.json" || true
          curl -sL -o data/news_cache.json \
            "https://raw.githubusercontent.com/miravosqueinteresante/partidos-hoy/gh-pages/data/news_cache.json" || true

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Generate predictions JSON with Polymarket value comparison
        run: |
          python scripts/polymarket_value.py
          python -c "
          import json
          with open('predictions/latest.json') as f:
              parsed = json.load(f)
          total_matches = len(parsed['matches'])
          total_preds = sum(1 for m in parsed['matches'] if m.get('model') == 'elo')
          total_tbd = sum(1 for m in parsed['matches'] if m.get('status') == 'TBD')
          matched = sum(1 for m in parsed['matches'] if m.get('polymarket'))
          print(f'World Cup predictions generated: {total_matches} matches')
          print(f'Model: {parsed[\"model\"]}')
          print(f'Predictions: {total_preds}, TBD (knockout): {total_tbd}')
          print(f'Polymarket comparison: {matched} matches')
          for m in parsed['matches'][:5]:
              if 'probabilities' in m:
                  p = m['probabilities']
                  print(f'  {m[\"home\"]:20s} vs {m[\"away\"]:20s}  '
                        f'1: {p[\"home\"]*100:5.1f}%  X: {p[\"draw\"]*100:5.1f}%  2: {p[\"away\"]*100:5.1f}%')
              else:
                  print(f'  TBD ({m[\"stage\"]}) - {m[\"date\"]}')
          "

      - name: Enrich predictions with news sentiment (DuckDuckGo + Groq)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          echo "=== Diagnostic ==="
          if [ -n "$GROQ_API_KEY" ]; then echo "GROQ_API_KEY: SET"; else echo "GROQ_API_KEY: NOT SET"; fi
          if [ -f predictions/latest.json ]; then
            head -3 predictions/latest.json | grep generated_at
          fi
          # Calcular date_from según la fecha actual (UTC)
          CURRENT_DATE=$(date -u +%Y-%m-%d)
          if [[ "$CURRENT_DATE" < "2026-06-14" ]]; then
            DATE_FROM="2026-06-11"
          elif [[ "$CURRENT_DATE" < "2026-06-17" ]]; then
            DATE_FROM="2026-06-14"
          elif [[ "$CURRENT_DATE" < "2026-06-20" ]]; then
            DATE_FROM="2026-06-17"
          elif [[ "$CURRENT_DATE" < "2026-06-23" ]]; then
            DATE_FROM="2026-06-20"
          elif [[ "$CURRENT_DATE" < "2026-06-26" ]]; then
            DATE_FROM="2026-06-23"
          else
            DATE_FROM="2026-06-26"
          fi
          echo "Fecha de inicio: $DATE_FROM"
          python -m scripts.news_sentiment 8 "$DATE_FROM"
          echo "=== Post-Enrichment ==="
          grep -c '"news_sentiment"' predictions/latest.json && echo "matches have news" || echo "no news_sentiment found"
          echo "News sentiment enrichment complete"

      - name: Deploy to gh-pages
        run: |
          git config user.name 'github-actions'
          git config user.email 'actions@github.com'
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git checkout --orphan gh-pages 2>/dev/null || git checkout gh-pages
          cp -r predictions/latest.json .
          cp -r data/news_cache.json data/ 2>/dev/null || true
          git add latest.json data/news_cache.json 2>/dev/null || git add latest.json
          git diff --cached --quiet || git commit -m 'deploy: worldcup predictions $(date +%Y-%m-%d_%H:%M)'
          git push origin gh-pages --force

      # Healthchecks.io — ping de éxito/fallo (OPCIONAL)
      # Para activar: creá un check GRATIS en https://healthchecks.io,
      # luego agregá el UUID como GitHub Secret llamado HC_UUID
      # (Settings → Secrets and variables → Actions → New repository secret)
      # Mientras no configures el secret, este paso se saltea silenciosamente.
      - name: Ping healthchecks.io
        if: always()
        env:
          HC_UUID: ${{ secrets.HC_UUID }}
        run: |
          if [ -z "$HC_UUID" ] || [ "$HC_UUID" = "" ]; then
            echo "ℹ️ HC_UUID no configurado — saltando healthchecks.io"
            exit 0
          fi
          STATUS=""
          if [ "${{ job.status }}" = "success" ]; then
            curl -fsS -m 10 --retry 5 "https://hc-ping.com/$HC_UUID" || true
          else
            curl -fsS -m 10 --retry 5 "https://hc-ping.com/$HC_UUID/fail" || true
          fi
